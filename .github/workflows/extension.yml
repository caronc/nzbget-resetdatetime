# Runs the tests on every push and pull request, and makes a release for
# "v*" tags (git tag v1.0.0 builds resetdatetime-1.0.0-dist.zip).
#
# If a release for the tag already exists (for example one you made by
# hand), it is left alone. To replace its files with freshly built ones,
# run this workflow from the Actions tab, pick the tag under "Use workflow
# from", and tick "overwrite".
name: extension

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Replace the files on an existing release"
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # Run tests.py on every Python version ResetDateTime supports
  tests:
    # Ubuntu 22.04 is the newest runner that still offers Python 3.8
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the tests
        run: python tests.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests]
    runs-on: ubuntu-latest
    # Publishing a release needs write access to the repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Makes build/resetdatetime-<version>-dist.zip and its .sha256
      - name: Build
        run: ./build-extension.sh

      # The tag must match the version in manifest.json
      - name: Check the version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}"

      # An existing release is kept as is unless "overwrite" was ticked
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            if [ "${OVERWRITE}" = "true" ]; then
              gh release upload "${GITHUB_REF_NAME}" build/*-dist.zip build/*.sha256 --clobber
            else
              echo "::notice::Release ${GITHUB_REF_NAME} already exists, leaving it as is"
            fi
          else
            gh release create "${GITHUB_REF_NAME}" build/*-dist.zip build/*.sha256 --generate-notes
          fi
